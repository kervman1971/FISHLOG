<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>C'mon Bell!</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="C'mon Bell!" />
  <meta name="theme-color" content="#0096B4" />
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <style>
    :root{
      --bg-deep:#005F73;
      --bg-mid:#0096B4;
      --bg-top:#00B4D8;
      --panel:rgba(0,0,0,.18);
      --panel-2:rgba(0,0,0,.22);
      --panel-border:rgba(255,230,0,.35);
      --panel-border-2:rgba(255,230,0,.55);
      --ink:#FFFFFF;
      --ink-2:rgba(255,255,255,.88);
      --muted:rgba(255,255,255,.65);
      --line:rgba(255,230,0,.22);
      --gold:#FFE600;
      --gold-2:#FFF176;
      --gold-soft:rgba(255,230,0,.18);
      --orange:#FF9500;
      --orange-2:#FFB740;
      --orange-soft:rgba(255,149,0,.22);
      --teal:#FFE600;
      --teal-2:#FFF176;
      --teal-soft:rgba(255,230,0,.18);
      --violet:#FFE600;
      --violet-2:#FFF176;
      --danger:#FF4D5E;
      --danger-soft:rgba(255,77,94,.2);
      --card-bg:#006D84;
      --card-bg-2:#005F73;
      --radius:24px;
      --radius-sm:18px;
      --radius-xs:13px;
      --focus:0 0 0 3px rgba(255,230,0,.4);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    button, input, select, textarea, a { touch-action:manipulation; }
    html { -webkit-text-size-adjust:100%; }
    body{
      min-height:100vh;
      font-family:"Quicksand",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(255,230,0,.10), transparent 40%),
        radial-gradient(circle at 100% 15%, rgba(0,180,216,.20), transparent 45%),
        linear-gradient(170deg, var(--bg-top), var(--bg-mid) 50%, var(--bg-deep));
      background-attachment:fixed;
    }

    a{color:inherit}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    img{max-width:100%;display:block}

    .app{
      max-width:1100px;
      margin:0 auto;
      min-height:100vh;
      position:relative;
      z-index:1;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(5,9,17,.85);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      color:#fff;
      border-bottom:3px solid var(--gold);
      padding-top:env(safe-area-inset-top);
    }

    .topbar-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .brand-mark{
      width:44px;height:44px;
      border-radius:14px;
      background:linear-gradient(155deg, var(--gold), #FF9500);
      display:grid;
      place-items:center;
      font-size:22px;
      box-shadow:0 0 0 2px #000, 0 0 16px rgba(212,255,63,.45);
      transform:rotate(-4deg);
    }

    .brand-text{min-width:0}
    .brand-name{
      font-family:"Baloo 2",sans-serif;
      letter-spacing:.3px;
      font-size:24px;
      line-height:1;
      margin:0;
      font-weight:800;
    }
    .brand-sub{
      margin:3px 0 0;
      font-size:11px;
      color:rgba(255,255,255,.55);
      letter-spacing:.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .top-actions{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border:1px solid var(--panel-border-2);
      border-radius:999px;
      padding:11px 16px;
      font-weight:700;
      font-size:13px;
      line-height:1;
      transition:transform .1s ease, box-shadow .1s ease, opacity .1s ease;
      user-select:none;
      white-space:nowrap;
      font-family:"Baloo 2",sans-serif;
    }
    .btn:active{transform:scale(.97);opacity:.9}
    .btn:focus{outline:none;box-shadow:var(--focus)}
    .btn-primary{
      background:linear-gradient(155deg, var(--orange-2), var(--orange) 60%, #C44700);
      color:#fff;
      border:2px solid #000;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.12) inset,
        0 4px 0 #005F73;
    }
    .btn-primary:active{
      transform:translateY(3px);
      box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 1px 0 #005F73;
    }
    .btn-secondary{
      background:var(--panel-2);
      color:#fff;
      border-color:var(--panel-border-2);
    }
    .btn-tertiary{
      background:rgba(255,255,255,.08);
      color:#fff;
      border-color:rgba(255,255,255,.22);
    }
    .btn-danger{
      background:linear-gradient(160deg, var(--danger), #D94457);
      color:#fff;
      border-color:transparent;
      box-shadow:0 3px 0 rgba(0,0,0,.25);
    }
    .btn-sm{
      padding:8px 12px;
      font-size:12px;
      box-shadow:none;
    }
    .btn-icon{
      display:inline-flex;
      align-items:center;
      gap:7px;
    }

    .tabs{display:none}

    .bottom-nav{
      position:fixed;
      left:0;right:0;
      bottom:0;
      z-index:119;
      background:#002030;
      border-top:3px solid #FFE600;
      display:flex;
      flex-direction:column;
      padding-bottom:env(safe-area-inset-bottom);
    }

    .bnav-row{
      display:flex;
      justify-content:space-around;
      align-items:stretch;
      width:100%;
    }

    .bnav-row-secondary{
      background:rgba(0,10,18,.55);
      border-bottom:1px solid rgba(255,230,0,.14);
    }

    .bnav-row-primary{
      background:#002030;
    }

    .bnav-item{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      padding:8px 2px 6px;
      background:none;
      border:none;
      border-top:3px solid transparent;
      color:rgba(255,255,255,.45);
      cursor:pointer;
      touch-action:manipulation;
      min-width:0;
    }

    .bnav-row-secondary .bnav-item{
      padding:6px 2px 5px;
      border-top-width:2px;
    }

    .bnav-item.active{
      color:#FFE600;
      border-top-color:#FFE600;
      background:rgba(255,230,0,.08);
    }

    .bnav-icon{
      font-size:22px;
      line-height:1;
    }

    .bnav-row-secondary .bnav-icon{
      font-size:18px;
    }

    .bnav-label{
      font-size:9.5px;
      font-weight:800;
      letter-spacing:.2px;
      text-transform:uppercase;
      line-height:1.1;
      color:inherit;
      white-space:nowrap;
    }

    .bnav-row-secondary .bnav-label{
      font-size:9px;
    }

    main{
      padding:16px;
      padding-bottom:140px;
    }

    .section{display:none}
    .section.active{display:block}

    .hero{
      background:var(--panel);
      border:1px solid var(--panel-border);
      border-radius:var(--radius);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      overflow:hidden;
      position:relative;
      margin-bottom:16px;
    }

    .hero::after{
      content:"🎣";
      position:absolute;
      right:-14px;bottom:-26px;
      font-size:140px;
      opacity:.06;
      transform:rotate(-12deg);
      pointer-events:none;
    }

    .hero-inner{
      padding:20px;
      display:grid;
      gap:14px;
      position:relative;
      z-index:1;
    }

    .hero-kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.6px;
      text-transform:uppercase;
      color:#101D33;
      background:var(--gold);
      border-radius:999px;
      padding:7px 12px;
      width:max-content;
    }

    .hero-title{
      font-family:"Baloo 2",sans-serif;
      font-size:36px;
      line-height:1.05;
      letter-spacing:0;
      margin:0;
      max-width:11ch;
      font-weight:800;
      color:#fff;
    }

    .hero-copy{
      color:var(--ink-2);
      margin:0;
      font-size:14px;
      line-height:1.6;
      max-width:54ch;
    }

    .hero-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .glance-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }

    .stat{
      background:var(--panel-2);
      border:1px solid var(--panel-border);
      border-radius:var(--radius-sm);
      padding:12px;
    }

    .stat-label{
      font-size:10px;
      font-weight:800;
      letter-spacing:.8px;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:6px;
    }

    .stat-value{
      font-family:"Baloo 2",sans-serif;
      font-size:26px;
      line-height:1;
      letter-spacing:0;
      color:#fff;
      font-weight:800;
    }

    .stat-value.green{color:var(--teal-2)}
    .stat-value.blue{color:#7FC4F0}
    .stat-value.amber{color:var(--gold-2)}

    .strip{
      display:grid;
      gap:12px;
      grid-template-columns:1fr;
      margin-bottom:16px;
    }

    .strip-card{
      background:var(--panel);
      border:1px solid var(--panel-border);
      border-radius:var(--radius-sm);
      padding:14px;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

.strip-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}.strip-title{margin:0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;color:var(--muted);}.small-link{border:none;background:transparent;color:var(--teal-2);font-weight:700;font-size:12px;padding:0;}.search-row{display:grid;grid-template-columns:1fr;gap:10px;}.field, .select, .text, textarea{width:100%;border:1px solid var(--panel-border);border-radius:var(--radius-xs);background:rgba(255,255,255,.06);color:var(--ink);padding:12px 14px;transition:.15s ease;font-family:"Quicksand",sans-serif;font-weight:600;}.select option, .select optgroup{ color:#101D33; }.field::placeholder, .text::placeholder, textarea::placeholder{ color:var(--muted); }.field:focus, .select:focus, .text:focus, textarea:focus{outline:none;border-color:var(--teal-2);box-shadow:var(--focus);background:rgba(255,255,255,.10);}.search-filters{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 2px 14px;}.page-head h2{margin:0;font-family:"Baloo 2",sans-serif;font-size:24px;letter-spacing:0;font-weight:800;color:#fff;}.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px;}.section-grid{display:grid;gap:14px;}.catch-card, .spot-card, .panel, .leaderboard, .insight-card{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.5);border-radius:var(--radius-sm);color:#101D33;box-shadow:0 8px 24px rgba(0,0,0,.3);}.catch-card{padding:14px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;margin-bottom:10px;position:relative;overflow:hidden;}.catch-thumb{width:60px;height:60px;border-radius:var(--radius-xs);background:linear-gradient(155deg, var(--orange-2), #C44700);display:grid;place-items:center;overflow:hidden;font-size:26px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.15);}.catch-thumb img{width:100%;height:100%;object-fit:cover;}.catch-main
